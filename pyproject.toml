# Конфигурация инструментов разработки (ruff, mypy, coverage).
# Не содержит [build-system]/[project], поэтому не влияет на установку пакета.

[tool.ruff]
line-length = 100
target-version = "py310"
# Миграции Alembic — генерируемый код, не линтуем и не форматируем.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]
ignore = [
    "E402", # импорты в середине файла (частая практика в тестах)
    "E501", # длину строк контролирует formatter
    "B008", # FastAPI: Depends()/File() в сигнатурах — идиома фреймворка
    "BLE001", # осознанный перехват Exception в сервисных вызовах
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
